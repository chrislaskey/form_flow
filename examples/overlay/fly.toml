# fly.toml app configuration file generated for form-flow on 2026-09-13T10:18:38-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'form-flow'
primary_region = 'ewr'
kill_signal = 'SIGTERM'

[build]
[env]
  # On the volume mounted below, so the flows built in the demo survive a
  # deploy. SQLite writes demo.db-wal and demo.db-shm beside it.
  DATABASE_PATH = '/data/demo.db'
  PHX_HOST = 'form-flow.fly.dev'
  PORT = '8080'

# The database's disk. `fly deploy` creates this volume the first time it runs
# against an app that has none, at initial_size; after that it is left alone.
# One volume attaches to one Machine, which is why this app stays at one.
[[mounts]]
  source = 'form_flow_data'
  destination = '/data'
  initial_size = '1gb'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
